<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lazy Suppers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column. The week is a strip of seven rows with a
   big day stamp on the left; a single mustard accent marks the thing to do next. */
:root{
  --bg:#eaf0ec; --surface:#fbfcfa; --sunk:#dfe7e2;
  --ink:#17322b; --muted:#587068; --line:#cfdad4;
  --accent:#e2a81f; --accent-ink:#1c2a12;
  --good:#2b7a54; --warn:#b4531b;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1e1a; --surface:#172a25; --sunk:#12231f;
    --ink:#e6efe9; --muted:#9bb0a7; --line:#2a413a;
    --accent:#efba3c; --accent-ink:#1c2206;
    --good:#72c79b; --warn:#f09c66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1e1a; --surface:#172a25; --sunk:#12231f;
  --ink:#e6efe9; --muted:#9bb0a7; --line:#2a413a;
  --accent:#efba3c; --accent-ink:#1c2206;
  --good:#72c79b; --warn:#f09c66;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 96px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
h1 span{background:var(--accent);color:var(--accent-ink);padding:0 .22em;border-radius:6px;display:inline-block;transform:rotate(-2deg)}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.live i{background:var(--good)} .sync.warn i{background:var(--warn)}
.weeknav{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.weeknav .label{flex:1;font-family:var(--display);font-weight:700;font-size:20px}
.weeknav .label small{display:block;font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}
.icon{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;position:sticky;top:8px;z-index:5}
nav.tabs a{flex:1;text-align:center;padding:9px 6px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
nav.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs a b{font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;font-size:12px;margin-left:4px}
section{margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.summary .line{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.summary .line strong{color:var(--ink);font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:6px}
.left{font-size:14px;color:var(--muted)}
.left b{color:var(--warn);font-weight:600}
.days{display:grid;gap:8px;margin-top:14px}
.day{display:grid;grid-template-columns:62px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;align-items:center}
.day.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.stamp{font-family:var(--display);text-align:center;line-height:1}
.stamp .d{font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.stamp .n{font-size:13px;color:var(--muted);margin-top:4px;font-family:var(--body);font-variant-numeric:tabular-nums}
.meal h3{margin:0;font-size:17px;font-weight:700;line-height:1.25}
.meal h3 button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.meta{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:20px;padding:1px 8px;margin-right:4px;color:var(--muted)}
.meal .row{margin-top:8px}
.thaw{margin-top:8px;font-size:13px;line-height:1.35;border-left:3px solid var(--accent);padding:2px 0 2px 8px;color:var(--ink)}
.thaw b{font-weight:700}
.dcol{min-width:0}
.off{color:var(--muted);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details.set{margin-top:12px;font-size:14px}
details.set summary{cursor:pointer;color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:22px 0 4px}
h2+p.sub{margin:0 0 10px;color:var(--muted);font-size:14px}
h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list .nm{flex:1;min-width:0}
ul.list .nm small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
ul.list .q{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
ul.list a{font-size:13px;color:var(--muted)}
ul.list li.have .nm{color:var(--muted);text-decoration:line-through}
label.ck{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--good)}
input[type=text],input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.banner{border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:grid;gap:8px}
.banner.ready{border-color:var(--accent)}
.banner.done{border-color:var(--good)}
.banner strong{font-family:var(--display);font-size:17px}
.banner p{margin:0;font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:2px 9px;background:var(--sunk);color:var(--ink)}
.pill.ready{background:var(--accent);color:var(--accent-ink)}
.pill.done{background:var(--good);color:var(--bg)}
.empty{color:var(--muted);font-size:14px;padding:12px 2px}
.sheetwrap{position:fixed;inset:0;background:rgba(8,18,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:720px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{margin:0;font-size:24px;line-height:1.15}
.sheet ol{padding-left:20px;margin:6px 0}
.sheet ol li{margin:6px 0}
.sheet ul.ing{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}
.sheet ul.ing li{display:flex;justify-content:space-between;gap:12px;font-size:15px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.sheet ul.ing span{color:var(--muted);text-align:right}
.pick{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:11px 2px}
.pick strong{display:block;font-size:16px}
.pick em{font-style:normal;color:var(--good);font-size:13px;font-weight:600}
.gate{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;width:100%;max-width:340px;display:grid;gap:12px}
.gate h2{margin:0;font-size:24px}
.gate p{margin:0;font-size:14px;color:var(--muted)}
.gate input{font-size:24px;letter-spacing:.3em;text-align:center}
.gate .err{color:var(--warn);font-weight:600;min-height:1.4em}
body.locked .wrap{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.mweek{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px;border-radius:12px;padding:3px}
.mweek.cur{background:var(--sunk)}
.mcell{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:9px;min-height:84px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mcell.out{opacity:.45}
.mcell.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.mcell .n{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.mcell .m{font-size:11.5px;line-height:1.2;font-weight:600;overflow-wrap:anywhere;hyphens:auto}
.mcell:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.mnote{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
@media (max-width:420px){h1{font-size:28px}.day{grid-template-columns:52px 1fr;gap:10px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px)}to{transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Lazy <span>Suppers</span></h1>
    <div class="sync" id="sync"><i></i><span>Connecting</span></div>
  </header>
  <div class="weeknav">
    <button class="icon" id="prev" aria-label="Previous week">&#8249;</button>
    <div class="label" id="weeklabel"></div>
    <button class="icon" id="next" aria-label="Next week">&#8250;</button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#week" data-tab="week">Week</a>
    <a href="#month" data-tab="month">Month</a>
    <a href="#groceries" data-tab="groceries">Groceries</a>
    <a href="#recipes" data-tab="recipes">Recipes</a>
  </nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="gate"></div>
<div id="toast"></div>
<script>

function R(id,name,cuisine,protein,mins,method,ing,steps){RECIPES.push({id,name,cuisine,protein,mins,method,ing,steps});}

      Object.keys(j.docs).forEach(k=>{if(pending[k])return;const s=JSON.stringify(j.docs[k]);if(raw[k]!==s){raw[k]=s;docs[k]=j.docs[k];changed.push(k);}});
      if(!ready){ready=true;Object.keys(docL).forEach(k=>docL[k].slice().forEach(f=>f(snap(k))));Object.keys(colL).forEach(c=>colL[c].slice().forEach(f=>f(colSnap(c))));waiters.splice(0).forEach(f=>f());}
      else changed.forEach(emit);
    }catch(e){}finally{busy=false;}
  }
  function listen(map,key,fn,make){(map[key]=map[key]||[]).push(fn);if(ready)setTimeout(()=>{if(map[key].indexOf(fn)>=0)fn(make(key));},0);return()=>{const i=map[key].indexOf(fn);if(i>=0)map[key].splice(i,1);};}
  setInterval(()=>{if(!document.hidden)sync();},25000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync();});
  sync();
  return{
    doc(path){return{
      set(data){docs[path]=data;raw[path]=JSON.stringify(data);pending[path]=(pending[path]||0)+1;
        return call({op:"set",path,data}).finally(()=>{pending[path]--;});},
      get(){return ready?Promise.resolve(snap(path)):new Promise(res=>waiters.push(()=>res(snap(path))));},
      onSnapshot(fn){return listen(docL,path,fn,snap);}
    };},
    collection(col){return{onSnapshot(fn){return listen(colL,col,fn,colSnap);}};}
  };
}

/* ---------- Planning maths ---------- */
const up=x=>Math.max(1,Math.ceil(x-0.06));
/* Staples sold as whole cans, jars, cartons or packs: read how much a recipe uses from its amount text. */
function wholeUnits(txt){const m=/^(\d+)?\s*(?:(\d)\/(\d))?\s*(?:cans?|jars?|cartons?|packs?)\b/.exec(txt);if(!m||(!m[1]&&!m[2]))return 0;return (m[1]?+m[1]:0)+(m[2]?m[2]/m[3]:0);}
function analyse(ids){
  const use={},meals={},need={};
  ids.forEach(id=>{const r=RB[id];if(!r)return;r.ing.forEach(a=>{const k=a[0];if(!meals[k]){use[k]=0;meals[k]=[];need[k]=0;}use[k]+=a[1];meals[k].push(r.name);if(ING[k].kind==="s")need[k]+=wholeUnits(a[2]);});});
  let bought=0,used=0,waste=0,fresh=0;const left=[];
  for(const k in use){if(ING[k].kind!=="f")continue;fresh++;const q=up(use[k]),l=q-use[k];bought+=q;used+=Math.min(q,use[k]);if(l>0.1){waste+=l;left.push({k,l});}}
  return{use,meals,need,left,waste,bought,used,fresh};
}
function score(ids){
  const a=analyse(ids);let s=a.waste*3+a.fresh*0.12;
  const pc={},cc={};
  ids.forEach(id=>{const r=RB[id];if(!r)return;pc[r.protein]=(pc[r.protein]||0)+1;cc[r.cuisine]=(cc[r.cuisine]||0)+1;if(S.recent.indexOf(id)>=0)s+=3;});
  for(const k in pc)if(pc[k]>2)s+=(pc[k]-2)*2;
  for(const k in cc)if(cc[k]>2)s+=(cc[k]-2)*1.5;
  return s;
}
function plannedIds(days){return DAYS.map(d=>(days||S.days)[d]).filter(id=>id&&RB[id]);}
function autoPlan(shuffle){
  const p=prefs();const days=shuffle?{}:Object.assign({},S.days);
  const empty=p.cookDays.filter(d=>!days[d]||!RB[days[d]]);
  if(!empty.length){toast("Every cooking night already has a meal. Shuffle to start over.");return;}
  const fixed=plannedIds(days);
  const pool=RECIPES.filter(r=>!p.hidden[r.id]&&fixed.indexOf(r.id)<0).map(r=>r.id);
  if(pool.length<empty.length){toast("Not enough recipes left to choose from. Unhide a few in Recipes.");return;}
  let best=null,bestS=Infinity;
  for(let t=0;t<900;t++){
    const pick=[];const used={};
    while(pick.length<empty.length){const id=pool[Math.floor(Math.random()*pool.length)];if(!used[id]){used[id]=1;pick.push(id);}}
    const s=score(fixed.concat(pick))+Math.random()*0.3;
    if(s<bestS){bestS=s;best=pick;}
  }
  DAYS.forEach(d=>{if(empty.indexOf(d)>=0)days[d]=best[empty.indexOf(d)];});
  setDays(days);
}
function setDays(days){const clean={};DAYS.forEach(d=>{if(days[d])clean[d]=days[d];});S.days=clean;saveWeek();render();}

const THAW_MAYBE={gbeef:"ground beef",chthigh:"chicken thighs",chbreast:"chicken breasts",sausage:"sausages",porkchop:"pork chops",bacon:"bacon",kielbasa:"kielbasa"};
const THAW_ALWAYS={salmon:"salmon",shrimp:"shrimp"};
function thawFor(r){if(!r)return null;let a=null,m=null;r.ing.forEach(x=>{if(THAW_ALWAYS[x[0]])a=THAW_ALWAYS[x[0]];else if(THAW_MAYBE[x[0]])m=THAW_MAYBE[x[0]];});
  if(a)return{always:true,what:a};if(m)return{always:false,what:m};return null;}
function thawText(t){const pl=/s$/.test(t.what);return t.always?"move the "+t.what+" from the freezer to the fridge":"if the "+t.what+(pl?" are":" is")+" in the freezer, move "+(pl?"them":"it")+" to the fridge";}

  return'<div class="thaw"><b>Thaw tonight:</b> '+thawText(t)+" for "+when+"’s "+esc((SHORT[r.id]||r.name).toLowerCase())+'.</div>';}

const PLURAL={bunch:"bunches",loaf:"loaves",dozen:"dozen",box:"boxes"};
function qtyText(ing,q){if(ing.unit==="each")return String(q);return q+" "+(q===1?ing.unit:(PLURAL[ing.unit]||ing.unit+"s"));}
function fracText(l){const t=[[.25,"a quarter"],[.33,"a third"],[.5,"half"],[.67,"two thirds"],[.75,"three quarters"]];let b=t[0];t.forEach(x=>{if(Math.abs(x[0]-l)<Math.abs(b[0]-l))b=x;});return b[1];}
function buildList(){
  const a=analyse(plannedIds());const p=prefs();const fresh=[],staples=[];
  for(const k in a.use){const ing=ING[k];
    const row={id:k,name:ing.name,aisle:ing.aisle,search:ing.search,meals:a.meals[k]};
    if(ing.kind==="f"){row.qty=up(a.use[k]);row.qtyText=qtyText(ing,row.qty);row.have=!!S.weekHave[k];fresh.push(row);}
    else{row.qty=up(a.need[k]||0);row.qtyText=qtyText(ing,row.qty);row.have=!!p.have[k];staples.push(row);}
  }
  const by=(x,y)=>AISLES.indexOf(x.aisle)-AISLES.indexOf(y.aisle)||x.name.localeCompare(y.name);
  fresh.sort(by);staples.sort(by);
  return{a,fresh,staples,extras:p.regulars.filter(r=>r.on!==false).map(r=>r.t)};
}

}
function recipeRows(list,day){
  const p=prefs();const others=day?DAYS.filter(d=>d!==day).map(d=>S.days[d]).filter(id=>id&&RB[id]):null;
  const base=others?analyse(others):null;
  let rows=list.map(r=>{
    let hint="",s=0;
    if(base){
      const usesUp=base.left.filter(x=>r.ing.some(a=>a[0]===x.k&&a[1]>0)).map(x=>ING[x.k].name.replace(/\s*\(.*\)/,"").toLowerCase());
      if(usesUp.length)hint="Uses up your "+usesUp.join(" and ");
      s=score(others.concat([r.id]));
    }
    return{r,hint,s};
  });
  if(base)rows.sort((x,y)=>x.s-y.s);
  return rows.map(o=>{const r=o.r;const hid=p.hidden[r.id];
    return day?'<button class="pick" data-act="choose" data-day="'+day+'" data-id="'+r.id+'"><strong>'+esc(r.name)+'</strong><span class="meta">'+esc(recipeMeta(r))+'</span>'+(o.hint?'<br><em>'+esc(o.hint)+'</em>':"")+'</button>'
      :'<li><div class="nm"><button data-act="open" data-id="'+r.id+'" style="all:unset;cursor:pointer;font-weight:600">'+esc(r.name)+'</button><small>'+esc(recipeMeta(r))+(hid?" · hidden from suggestions":"")+'</small></div><button class="btn small ghost" data-act="hide" data-id="'+r.id+'">'+(hid?"Unhide":"Hide")+'</button></li>';
  }).join("");
}
function filtered(skipHidden){
  const p=prefs();const q=S.q.trim().toLowerCase();
  return RECIPES.filter(r=>(S.filter==="all"||r.protein===S.filter)&&(!q||(r.name+" "+r.cuisine+" "+r.method).toLowerCase().indexOf(q)>=0)&&(!skipHidden||!p.hidden[r.id]));
}
function filterBar(){
  return'<input type="search" id="q" placeholder="Search '+RECIPES.length+' dinners" value="'+esc(S.q)+'" aria-label="Search recipes"><div class="chips">'+
    PROTEINS.map(x=>'<button class="chip'+(S.filter===x[0]?" on":"")+'" data-act="filter" data-f="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>';
}
function viewRecipes(){
  const list=filtered(false);
  return'<section>'+filterBar()+'<p class="sub" style="color:var(--muted);font-size:14px;margin:10px 0">Every dinner feeds two with a bit left for lunch. Hide anything you never want suggested.</p>'+
    (list.length?'<ul class="list" id="rlist">'+recipeRows(list,null)+'</ul>':'<div class="empty">No dinners match that search.</div>')+'</section>';
}
function sheetHtml(){
  const sh=S.sheet;if(!sh)return"";
  let inner="";
  if(sh.type==="recipe"){
    const r=RB[sh.id];
    inner='<div class="hd"><div><h2>'+esc(r.name)+'</h2><div class="meta">'+esc(recipeMeta(r))+' · feeds two, plus a lunch</div></div><button class="icon" data-act="close" aria-label="Close">&#215;</button></div>'+
      '<h4>You need</h4><ul class="ing">'+r.ing.map(a=>'<li>'+esc(ING[a[0]].name.replace(/\s*\(.*\)/,""))+'<span>'+esc(a[2])+'</span></li>').join("")+'</ul>'+
      (thawFor(r)?'<h4>The night before</h4><p style="margin:6px 0;font-size:15px">'+(s=>s.charAt(0).toUpperCase()+s.slice(1)+".")(thawText(thawFor(r)))+'</p>':"")+
      '<h4>Do this</h4><ol>'+r.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol>'+
      '<h4>Put it on</h4><div class="chips">'+DAYS.map(d=>'<button class="chip'+(S.days[d]===r.id?" on":"")+'" data-act="choose" data-day="'+d+'" data-id="'+r.id+'">'+DAYNAME[d].slice(0,3)+'</button>').join("")+'</div>';
  }else{
    const list=filtered(true);
    inner='<div class="hd"><h2>'+DAYNAME[sh.day]+' dinner</h2><button class="icon" data-act="close" aria-label="Close">&#215;</button></div>'+
      '<p class="meta" style="margin:4px 0 10px">Best fits first: meals that finish what you are already buying.</p>'+filterBar()+
      '<div id="rlist" style="margin-top:10px">'+(list.length?recipeRows(list,sh.day):'<div class="empty">No dinners match that search.</div>')+'</div>';
  }
  return'<div class="sheetwrap" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">'+inner+'</div></div>';
}
function render(){
  renderSync();if(S.tab==="month")monthLabel();else weekLabel();
  const L=buildList();const n=orderItems(L);const cnt=n.items.length+n.extras.length;
  document.querySelectorAll("#tabs a").forEach(a=>{a.classList.toggle("on",a.dataset.tab===S.tab);
    if(a.dataset.tab==="groceries")a.innerHTML="Groceries"+(cnt?"<b>"+cnt+"</b>":"");});
  const keep=document.activeElement&&document.activeElement.id==="q";
  const pos=keep?document.activeElement.selectionStart:0;
  $("main").innerHTML=S.tab==="groceries"?viewGroceries():S.tab==="recipes"?viewRecipes():S.tab==="month"?viewMonth():viewWeek();
  $("overlay").innerHTML=sheetHtml();
  if(keep){const q=$("q");if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}}
}
let toastT=null;
function toast(msg){const t=$("toast");t.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>{t.innerHTML="";},3800);}

/* ---------- Actions ---------- */
function act(a,el){
  const p=prefs();const d=el.dataset;
  if(a==="goweek"){if(d.week!==S.week){S.week=d.week;watchWeek();}location.hash="#week";if(S.tab==="week")render();return;}
  if(a==="thismonth"){S.month=THISWEEK.slice(0,7)+"-01";render();return;}
  if(a==="plan")autoPlan(false);
  else if(a==="shuffle")autoPlan(true);
  else if(a==="clear"){const x=Object.assign({},S.days);delete x[d.day];setDays(x);}
  else if(a==="swap"){S.sheet={type:"pick",day:d.day};S.q="";S.filter="all";render();}
  else if(a==="open"){S.sheet={type:"recipe",id:d.id};render();}
  else if(a==="close"){S.sheet=null;S.q="";S.filter="all";render();}
  else if(a==="choose"){const x=Object.assign({},S.days);DAYS.forEach(k=>{if(x[k]===d.id)delete x[k];});x[d.day]=d.id;S.sheet=null;S.q="";S.filter="all";setDays(x);toast(RB[d.id].name+" is on "+DAYNAME[d.day]+".");}
  else if(a==="cookday"){let c=p.cookDays.slice();const i=c.indexOf(d.day);if(i>=0)c.splice(i,1);else c.push(d.day);c=DAYS.filter(k=>c.indexOf(k)>=0);p.cookDays=c;setPrefs(p);}
  else if(a==="filter"){S.filter=d.f;render();}
  else if(a==="hide"){if(p.hidden[d.id])delete p.hidden[d.id];else p.hidden[d.id]=true;setPrefs(p);}
  else if(a==="have"){if(ING[d.id]&&ING[d.id].kind==="f"){const w=Object.assign({},S.weekHave);if(el.checked)w[d.id]=true;else delete w[d.id];S.weekHave=w;saveWeek();render();}
    else{if(el.checked)p.have[d.id]=true;else delete p.have[d.id];setPrefs(p);}}
  else if(a==="regtoggle"){p.regulars[+d.i].on=el.checked;setPrefs(p);}
  else if(a==="regdel"){p.regulars.splice(+d.i,1);setPrefs(p);}
  else if(a==="send"){const o=orderItems(buildList());if(!o.items.length&&!o.extras.length){toast("There is nothing on the list yet.");return;}
    S.order={status:"ready",store:"superstore",week:S.week,items:o.items,extras:o.extras,sentAt:new Date().toISOString()};save("orders/"+S.week,S.order);render();toast("Sent. Tell Claude to fill your Superstore cart.");}
  else if(a==="unsend"){S.order={status:"draft",week:S.week};save("orders/"+S.week,S.order);render();}
  else if(a==="picked"){(S.order.items||[]).forEach(i=>{if(ING[i.id]&&ING[i.id].kind==="s")p.have[i.id]=true;});S.prefs=p;save("state/prefs",p);
    S.order=Object.assign({},S.order,{status:"done"});save("orders/"+S.week,S.order);render();}
  else if(a==="copy"){const txt=listText(buildList());
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("List copied.")).catch(()=>toast("Copying is blocked here. Select the list and copy it by hand."));}
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act;
  if(a==="backdrop"){if(e.target===el){S.sheet=null;S.q="";S.filter="all";render();}return;}
  if(el.tagName==="INPUT")return;
  act(a,el);
});
document.addEventListener("change",e=>{const el=e.target;if(el.tagName==="INPUT"&&el.dataset.act)act(el.dataset.act,el);});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;
  const box=$("rlist");const day=S.sheet&&S.sheet.type==="pick"?S.sheet.day:null;const list=filtered(!!day);
  if(box)box.innerHTML=list.length?recipeRows(list,day):'<div class="empty">No dinners match that search.</div>';else render();}});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="pinform"){const v=$("pin").value.trim();if(v)tryPin(v);return;}if(e.target.id==="addreg"){const v=$("regtext").value.trim();if(!v)return;const p=prefs();p.regulars.push({t:v.slice(0,80),on:true});setPrefs(p);}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render();}});
$("prev").addEventListener("click",()=>{if(S.tab==="month"){shiftMonth(-1);render();return;}S.week=addDays(S.week,-7);watchWeek();render();});
$("next").addEventListener("click",()=>{if(S.tab==="month"){shiftMonth(1);render();return;}S.week=addDays(S.week,7);watchWeek();render();});
function route(){const h=(location.hash||"").slice(1);S.tab=h==="groceries"||h==="recipes"||h==="month"?h:"week";if(S.tab==="month")S.month=S.week.slice(0,7)+"-01";S.sheet=null;render();window.scrollTo(0,0);}
window.addEventListener("hashchange",route);
S.tab=(function(){const h=(location.hash||"").slice(1);return h==="groceries"||h==="recipes"||h==="month"?h:"week";})();
boot();
</script>
</body>
</html>
